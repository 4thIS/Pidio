[project]
name = "pidio-backend"
version = "0.1.0"
description = "Pidio 백엔드 (FastAPI + mpv 제어)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
